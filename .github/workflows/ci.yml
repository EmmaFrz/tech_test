name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  containers:
    name: Containers (Compose ${{ matrix.compose }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        compose: [v1, v2]
    env:
      COMPOSE_API_VERSION: '1.44'
      COMPOSE_DOCKER_CLI_BUILD: '1'
      DOCKER_BUILDKIT: '1'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22.23.3'
      - name: Install Compose v1
        if: matrix.compose == 'v1'
        run: |
          mkdir -p "$RUNNER_TEMP/compose-v1"
          curl --fail --location --retry 3 \
            https://github.com/docker/compose/releases/download/1.29.2/docker-compose-Linux-x86_64 \
            --output "$RUNNER_TEMP/compose-v1/docker-compose"
          chmod +x "$RUNNER_TEMP/compose-v1/docker-compose"
          echo "$RUNNER_TEMP/compose-v1" >> "$GITHUB_PATH"
          echo "COMPOSE_COMMAND=docker-compose" >> "$GITHUB_ENV"
      - name: Install Compose v2
        if: matrix.compose == 'v2'
        run: |
          mkdir -p "$HOME/.docker/cli-plugins"
          curl --fail --location --retry 3 \
            https://github.com/docker/compose/releases/download/v2.40.3/docker-compose-linux-x86_64 \
            --output "$HOME/.docker/cli-plugins/docker-compose"
          chmod +x "$HOME/.docker/cli-plugins/docker-compose"
          echo "COMPOSE_COMMAND=docker compose" >> "$GITHUB_ENV"
      - name: Build and start
        run: |
          $COMPOSE_COMMAND version
          $COMPOSE_COMMAND config --quiet
          $COMPOSE_COMMAND up --build --detach
          curl --fail --retry 12 --retry-delay 2 --retry-all-errors --max-time 5 http://localhost:3000/
      - name: Check routes, health and proxy
        run: |
          node scripts/check-stack.mjs
          test "$($COMPOSE_COMMAND exec -T web id -u)" != 0
          test "$($COMPOSE_COMMAND exec -T mock-server id -u)" != 0
      - name: Run unit tests in Docker
        run: $COMPOSE_COMMAND --profile test run --rm unit
      - name: Check development profile
        run: |
          $COMPOSE_COMMAND --profile dev up --build --detach web-dev
          curl --fail --retry 12 --retry-delay 2 --retry-all-errors --max-time 5 http://localhost:5173/
          STACK_URL=http://localhost:5173 node scripts/check-stack.mjs
      - name: Run browser tests in Docker
        if: matrix.compose == 'v2'
        run: $COMPOSE_COMMAND --profile e2e run --rm e2e
      - name: Container logs
        if: always()
        run: $COMPOSE_COMMAND logs --no-color
      - name: Stop containers
        if: always()
        run: $COMPOSE_COMMAND down --volumes
