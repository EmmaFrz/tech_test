map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Docker's embedded DNS. The backend's name is resolved again at runtime, so a recreated
# mock-server container on a new address is reached without reloading nginx.
resolver 127.0.0.11 valid=5s ipv6=off;

upstream mock_server {
    zone mock_server 64k;
    server mock-server:4000 resolve;
}

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /ws {
        proxy_pass http://mock_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
